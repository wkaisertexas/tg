[package]
name = "tscodeselection"
version = "0.1.0"
edition = "2024"
description = "A symbol-aware terminal file selector"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fuzzy-matcher = "0.3"
ignore = "0.4"
ratatui = "0.29"
regex = "1"
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"

[dev-dependencies]
assert_cmd = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
