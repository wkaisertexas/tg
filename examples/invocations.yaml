version: 1

description: >-
  Interactive MVP examples backed by shallow clones in the ignored corpus
  directory. Locations are pinned to the recorded commits and use one-based
  byte columns. Each case starts the REPL from the tscodeselection repository
  root, selects the displayed reference, and submits the prompt.

command:
  program: tscodeselection
  argv:
    - .
  working_directory: repository_root
  output_format: plain_text

corpus:
  - id: flask
    language: python
    path: corpus/python/flask
    repository: https://github.com/pallets/flask.git
    commit: 6a2f545bfd8ed31e19066a299296917e034aca58
    clone_depth: 1

  - id: requests
    language: python
    path: corpus/python/requests
    repository: https://github.com/psf/requests.git
    commit: 1f6589ec3a1ee910f9a65cc3ceac60b26677bc0e
    clone_depth: 1

  - id: fmt
    language: cpp
    path: corpus/cpp/fmt
    repository: https://github.com/fmtlib/fmt.git
    commit: a245c6de992168642562395988e0a035dc3ecc01
    clone_depth: 1

  - id: nlohmann_json
    language: cpp
    path: corpus/cpp/json
    repository: https://github.com/nlohmann/json.git
    commit: 3c0a9a99fd516be4264b10015461384b60f5cc97
    clone_depth: 1

cases:
  - id: python_flask_class
    language: python
    corpus: flask
    file_query: flask/app.py
    symbol_query: Flask
    submitted_prompt: "Inspect %corpus/python/flask/src/flask/app.py::Flask"
    selected:
      display_reference: "%corpus/python/flask/src/flask/app.py::Flask"
      file: corpus/python/flask/src/flask/app.py
      symbol: Flask
      kind: class
      line: 109
      column: 7
    expected:
      lowered_reference: corpus/python/flask/src/flask/app.py::109:7 Flask
      stdout: "Inspect corpus/python/flask/src/flask/app.py::109:7 Flask\n"
      preview:
        header: corpus/python/flask/src/flask/app.py
        focus_line: 109
        first_line: 104
        last_line: 114

  - id: python_flask_nested_method
    language: python
    corpus: flask
    file_query: flask/app.py
    symbol_query: run
    submitted_prompt: "Explain startup behavior in %corpus/python/flask/src/flask/app.py::run"
    selected:
      display_reference: "%corpus/python/flask/src/flask/app.py::run"
      file: corpus/python/flask/src/flask/app.py
      symbol: run
      qualified_symbol: Flask::run
      kind: method
      line: 632
      column: 9
    expected:
      lowered_reference: corpus/python/flask/src/flask/app.py::632:9 run
      stdout: "Explain startup behavior in corpus/python/flask/src/flask/app.py::632:9 run\n"
      preview:
        header: corpus/python/flask/src/flask/app.py
        focus_line: 632
        first_line: 627
        last_line: 637

