version: 2

description: >-
  Current, hermetic examples for deterministic prompt lowering. The integration
  suite materializes these small sources in a temporary repository, so the
  examples run on a clean checkout without downloading external corpora.

command:
  program: tg
  usage: "tg --root FIXTURE_ROOT --resolve PROMPT"
  output_format: plain_text

cases:
  - id: ignored_python_method_through_broad_file_provider
    language: python
    file: generated/widget.py
    source: |
      # Generated fixture intentionally ignored by Git.

      class Widget:
          def render(self):
              value = 'rendered'
              return value

          def reset(self):
              return None

      # End fixture.
    submitted_prompt: "Inspect %generated/widget.py::render"
    selected:
      symbol: render
      line: 4
      column: 9
    expected:
      stdout: "Inspect generated/widget.py::4:9 render\n"
      preview:
        first_line: 1
        last_line: 9
        focus_line: 4

  - id: visible_rust_function_through_git_aware_file_provider
    language: rust
    file: src/worker.rs
    source: |
      // Checked-in fixture.

      pub struct Worker;

      impl Worker {
          pub fn execute(&self) -> bool {
              true
          }
      }

      // End fixture.
    submitted_prompt: "Trace @src/worker.rs::execute"
    selected:
      symbol: execute
      line: 6
      column: 12
    expected:
      stdout: "Trace src/worker.rs::6:12 execute\n"
      preview:
        first_line: 1
        last_line: 11
        focus_line: 6
