name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        env:
          TG_REPOSITORY: ${{ github.repository }}
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Prepare verified asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tg" "dist/tg-${{ matrix.target }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "dist/tg-${{ matrix.target }}" > "dist/tg-${{ matrix.target }}.sha256"
          else
            shasum -a 256 "dist/tg-${{ matrix.target }}" > "dist/tg-${{ matrix.target }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tg-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
